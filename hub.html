<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AIBRO — все отчёты</title>
<style>:root{--bg:#0b0f17;--card:#151d2b;--line:#26324a;--ink:#e8eef7;--mut:#93a3bd;--dim:#6b7c99;
--a:#4aa8ff;--g:#5ad19a;--y:#ffb454;--d:#ff6b8a;--mono:ui-monospace,Menlo,Consolas,monospace;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.45}
a{color:var(--a);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header{padding:26px 0 12px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--g)}
h1{font-size:clamp(20px,3vw,28px);margin:8px 0 4px}
.upd{font-family:var(--mono);font-size:12px;color:var(--mut)}.upd b{color:var(--g)}
.verdict{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--a);border-radius:10px;padding:12px 16px;margin:16px 0;color:var(--mut)}
.verdict.bad{border-left-color:var(--d)}.verdict.good{border-left-color:var(--g)}.verdict b{color:var(--ink)}
h2{font-size:16px;margin:20px 0 8px}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:500}
td.c,th.c{text-align:center}.dim{color:var(--dim)}.up{color:var(--g)}.down{color:var(--d)}
.prev{max-width:420px}
footer{border-top:1px solid var(--line);margin-top:22px;padding:16px 0 40px;color:var(--dim);font-size:12px}
html,body{height:100%}body{display:flex;flex-direction:column;height:100vh}
.top{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px}
.top h1{font-size:18px;margin:0}.top .upd{font-size:11.5px}
.layout{flex:1;display:flex;min-height:0}
.side{width:210px;border-right:1px solid var(--line);padding:12px 8px;overflow:auto;background:#0d1420}
.tab{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:1px solid transparent;
color:var(--mut);font-family:var(--sans);font-size:13.5px;padding:9px 11px;border-radius:9px;cursor:pointer;margin-bottom:3px}
.tab span{font-size:15px}
.tab:hover{background:var(--card);color:var(--ink)}
.tab.on{background:rgba(74,168,255,.12);border-color:var(--a);color:var(--ink)}
.main{flex:1;min-width:0}iframe{width:100%;height:100%;border:0;background:var(--bg)}
.side .hint{font-size:11px;color:var(--dim);padding:8px 11px}
@media(max-width:720px){.side{width:150px}.tab{font-size:12px;padding:8px}}
</style></head><body>
<div class="top"><h1>📂 AIBRO — все отчёты</h1><span class="upd">обновлено <b>2026-08-22 05:35 UTC</b> · переключай вкладки слева</span>
<a href="#" id="open" style="margin-left:auto;font-size:12px">открыть в новой вкладке ↗</a></div>
<div class="layout">
<nav class="side"><button class="tab on" data-url="https://neuroboostpr-pixel.github.io/aibro-tg-dashboard/"><span>📈</span>TG посты</button><button class="tab" data-url="https://neuroboostpr-pixel.github.io/aibro-tg-dashboard/report_recommendations.html"><span>🎯</span>🎯 Рекомендации</button><button class="tab" data-url="https://neuroboostpr-pixel.github.io/aibro-tg-dashboard/topics.html"><span>📡</span>Радар тем</button><button class="tab" data-url="https://neuroboostpr-pixel.github.io/aibro-tg-dashboard/report_carousels.html"><span>📊</span>Карусели</button><button class="tab" data-url="https://neuroboostpr-pixel.github.io/aibro-tg-dashboard/report_reels.html"><span>🎬</span>Рилсы: динамика</button><button class="tab" data-url="https://neuroboostpr-pixel.github.io/aibro-tg-dashboard/report_reels_retention.html"><span>⏱</span>Рилсы: удержание</button><button class="tab" data-url="https://neuroboostpr-pixel.github.io/ig-analytics-data/"><span>📷</span>IG аналитика</button><button class="tab" data-url="https://neuroboostpr-pixel.github.io/aibro-task-bank/"><span>🧩</span>Банк задач</button><div class="hint">Каждый отчёт обновляется сам каждый день.</div></nav>
<div class="main"><iframe id="fr" src="https://neuroboostpr-pixel.github.io/aibro-tg-dashboard/"></iframe></div>
</div>
<script>
var fr=document.getElementById('fr'),op=document.getElementById('open');
op.href=fr.src;
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on');fr.src=b.dataset.url;op.href=b.dataset.url;};});
</script></body></html>
